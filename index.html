<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOAGEN</title>
<meta name="description" content="Daha fazlası değil, doğru form. LOAGEN: wellness ve takviye.">
<meta property="og:title" content="LOAGEN">
<meta property="og:description" content="Daha fazlası değil, doğru form.">
<meta name="theme-color" content="#1b3358">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#23406A;--deep:#1b3358;--sage:#ACB187;--cream:#F4ECA3;--ink:#F7F3D6;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--deep);scroll-behavior:smooth}
body{font-family:Montserrat,system-ui,sans-serif;color:var(--ink);background:var(--deep);min-height:100vh;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 20px calc(48px + env(safe-area-inset-bottom))}
section{padding-top:34px}
.hero{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 0 6px}
.logo{width:104px;height:104px;border-radius:50%;background:var(--ink);display:grid;place-items:center;margin-bottom:22px;box-shadow:0 0 0 7px rgba(172,177,135,.22),0 0 60px rgba(244,236,163,.28);opacity:0;transform:scale(.7);animation:pop 1.1s .1s var(--ease) forwards}
.logo img{width:60%;height:auto;display:block}
@keyframes pop{to{opacity:1;transform:none}}
.brand{font-size:15px;font-weight:700;letter-spacing:.5em;padding-left:.5em}
.brand span,.tag span{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(8px);animation:in .9s var(--ease) forwards}
.tag{margin-top:26px;font-size:26px;font-weight:700;line-height:1.2;max-width:330px}
.tag em{font-style:normal;color:var(--cream)}
.sub{margin-top:14px;font-size:13px;color:var(--sage);opacity:0;animation:in 1s 1.5s var(--ease) forwards}
.down{display:none;margin-top:36px;width:26px;height:42px;border:1.5px solid rgba(172,177,135,.6);border-radius:14px;position:relative;opacity:0;animation:in 1s 2s forwards}
.down:after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--cream);animation:dot 1.6s infinite}
@keyframes dot{0%{transform:translateY(0);opacity:1}80%{transform:translateY(14px);opacity:0}100%{opacity:0}}
@keyframes in{to{opacity:1;filter:blur(0);transform:none}}
.rv{opacity:0;filter:blur(10px);transform:translateY(22px);transition:opacity .9s var(--ease),filter .9s var(--ease),transform .9s var(--ease)}
.rv.on{opacity:1;filter:none;transform:none}
.sec{font-size:11px;font-weight:600;letter-spacing:.24em;color:var(--sage);text-transform:uppercase;margin:0 4px 14px;display:flex;align-items:center;gap:10px}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(172,177,135,.5),transparent)}
.shop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border-radius:22px;background:var(--cream);color:var(--navy);text-decoration:none;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(244,236,163,.18)}
.shop b{font-size:17px;display:block}.shop span{font-size:12.5px;opacity:.72}
.shop i{width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;font-style:normal;transition:transform .3s var(--ease)}
.shop:hover i{transform:translateX(4px)}
.shop:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s 2.5s infinite}
@keyframes shine{0%{left:-60%}40%,100%{left:140%}}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.vid{flex:0 0 58%;scroll-snap-align:center;aspect-ratio:9/14.5;border-radius:18px;position:relative;overflow:hidden;text-decoration:none;color:var(--ink);background:linear-gradient(160deg,#3a5a94,#23406A);border:1px solid rgba(172,177,135,.35);transition:transform .35s var(--ease)}
.vid:hover{transform:translateY(-4px) scale(1.015)}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.vid:hover img{transform:scale(1.06)}
.vid:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(10,20,40,.85));z-index:1}
.pf{position:absolute;top:10px;left:10px;z-index:2;font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--cream);color:var(--navy)}
.pl{position:absolute;z-index:2;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(27,51,88,.7);backdrop-filter:blur(4px);display:grid;place-items:center;font-size:12px}
.vt{position:absolute;z-index:2;left:12px;right:12px;bottom:12px;font-size:14px;font-weight:700;line-height:1.25}
.pod{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;background:rgba(244,236,163,.08);border:1px solid rgba(172,177,135,.35);text-decoration:none;color:inherit;transition:border-color .3s,background .3s}
.pod:hover{border-color:var(--sage);background:rgba(244,236,163,.13)}
.pb{width:54px;height:54px;border-radius:50%;background:var(--cream);color:var(--navy);display:grid;place-items:center;flex:none;font-size:16px}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:15px}.pt span{font-size:12.5px;color:rgba(247,243,214,.68)}
.wave{display:flex;align-items:center;gap:3px;height:28px;margin-top:8px}
.wave i{width:3px;border-radius:2px;background:var(--sage);height:30%;animation:w 1.1s ease-in-out infinite}
@keyframes w{50%{height:100%;background:var(--cream)}}
.blog{display:flex;flex-direction:column;gap:10px}
.bc img{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.bc{display:flex;gap:14px;align-items:center;padding:12px 16px 12px 12px;border-radius:18px;background:rgba(244,236,163,.06);border:1px solid rgba(172,177,135,.3);text-decoration:none;color:inherit;transition:transform .3s var(--ease),border-color .3s}
.bc:hover{transform:translateX(4px);border-color:var(--sage)}
.bc b{display:block;font-size:15px}.bc span{font-size:12.5px;color:rgba(247,243,214,.68)}
.bc i{margin-left:auto;font-style:normal;opacity:.6}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{perspective:700px;text-decoration:none;color:var(--navy)}
.pc{border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:#eceef1;box-shadow:0 14px 34px rgba(0,0,0,.28);transition:transform .25s ease-out;transform-style:preserve-3d}
.pc img{display:block;width:100%;aspect-ratio:1.12/1;object-fit:cover}
.pc .lb{padding:10px 14px 14px;background:var(--cream)}
.pc b{font-size:16px;display:block}.pc span{font-size:12px;opacity:.75}
.soc{display:flex;justify-content:center;gap:12px;margin-top:40px}
.soc a{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:1px solid rgba(172,177,135,.45);transition:background .25s,transform .25s var(--ease)}
.soc a:hover{background:rgba(244,236,163,.15);transform:translateY(-3px)}
.soc svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
footer{margin-top:26px;text-align:center;font-size:11.5px;color:rgba(172,177,135,.8);letter-spacing:.1em}
a:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv,.brand span,.tag span,.sub,.down{opacity:1!important;filter:none!important;transform:none!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <section class="hero">
    <div class="logo"><img src="img/logo.png" alt="LOAGEN"></div>
    <div class="brand" id="brand">LOAGEN</div>
    <h1 class="tag" id="tag">Daha fazlası değil, <em>doğru form.</em></h1>
    <p class="sub">Bilim, felsefe ve insan üstüne.</p>
    <div class="down" aria-hidden="true"></div>
  </section>

  <section class="rv">
    <a class="shop" href="https://www.loagen.com.tr/?utm_source=link&utm_medium=bio&utm_campaign=hero">
      <div><b>Mağazayı keşfet</b><span>loagen.com.tr</span></div><i>&rarr;</i>
    </a>
  </section>

  <section class="rv">
    <div class="sec">Videolar</div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="rv">
    <div class="sec">Podcast</div>
    <a class="pod" href="https://open.spotify.com/search/Loagen">
      <div class="pb">&#9654;</div>
      <div class="pt"><b>Loagen Podcast</b><span>Bilim, felsefe, insan</span>
        <div class="wave" aria-hidden="true"></div></div>
    </a>
  </section>

  <section class="rv">
    <div class="sec">Ürünler</div>
    <div class="prods">
      <a class="prod" href="https://www.loagen.com.tr/products/magnativ-magnezyum?utm_source=link&utm_medium=bio&utm_campaign=magnativ"><div class="pc"><img src="img/magnativ.jpg" alt="Magnativ"><div class="lb"><b>Magnativ</b><span>Magnezyum</span></div></div></a>
      <a class="prod" href="https://www.loagen.com.tr/products/folinativ-folik-asit?utm_source=link&utm_medium=bio&utm_campaign=folinativ"><div class="pc"><img src="img/folinativ.jpg" alt="Folinativ"><div class="lb"><b>Folinativ</b><span>Folik asit</span></div></div></a>
    </div>
  </section>

  <section class="rv">
    <div class="sec">Blog</div>
    <div class="blog" id="blog"></div>
  </section>

  <nav class="soc rv" aria-label="Sosyal medya">
    <a href="https://www.instagram.com/loagenturkiye" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6"/></svg></a>
    <a href="https://www.tiktok.com/@loagenturkiye" aria-label="TikTok"><svg viewBox="0 0 24 24"><path d="M14 4v11a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 4c.4 2.4 2 3.9 4.5 4"/></svg></a>
    <a href="https://www.youtube.com/@loagenturkiye" aria-label="YouTube"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="4"/><path d="M10.5 9.5v5l4.2-2.5-4.2-2.5Z"/></svg></a>
  </nav>
  <footer>@loagenturkiye</footer>
</main>
<script>
(function(){
  var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var b=document.getElementById('brand');
  b.innerHTML=b.textContent.split('').map(function(c,i){return '<span style="animation-delay:'+(i*0.08)+'s">'+c+'</span>'}).join('');
  var tg=document.getElementById('tag'),n=0;
  (function wrap(node){
    if(node.nodeType===3){
      var f=document.createDocumentFragment();
      node.textContent.split(/(\s+)/).forEach(function(w){
        if(!w.trim()){f.appendChild(document.createTextNode(w));return}
        var s=document.createElement('span');s.textContent=w;s.style.animationDelay=(0.7+n++*0.12)+'s';f.appendChild(s)});
      node.replaceWith(f);
    } else Array.from(node.childNodes).forEach(wrap);
  })(tg);

  var wv=document.querySelector('.wave');
  for(var i=0;i<22;i++){var e=document.createElement('i');e.style.animationDelay=(i*0.08)+'s';wv.appendChild(e)}

  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}})},{threshold:.12});
  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});

  document.querySelectorAll('.prod').forEach(function(a){
    var c=a.firstElementChild;
    a.addEventListener('pointermove',function(ev){
      if(ev.pointerType==='touch'||RM)return;
      var r=a.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
      c.style.transform='rotateY('+x*14+'deg) rotateX('+(-y*14)+'deg)'});
    a.addEventListener('pointerleave',function(){c.style.transform=''});
  });

  fetch('icerik.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){
    var s=document.getElementById('strip');
    (d.videolar||[]).forEach(function(v){
      var a=document.createElement('a');a.className='vid';a.href=v.url;
      a.innerHTML=(v.kapak?'<img loading="lazy" alt="" src="'+v.kapak+'">':'')+'<span class="pf"></span><span class="pl">&#9654;</span><div class="vt"></div>';
      a.querySelector('.pf').textContent=v.platform;a.setAttribute('aria-label',v.baslik);if(v.kapak){a.querySelector('.vt').remove()}else{a.querySelector('.vt').textContent=v.baslik}s.appendChild(a)});
    var bl=document.getElementById('blog');
    (d.blog||[]).forEach(function(p){
      var a=document.createElement('a');a.className='bc';
      a.href=p.url+(p.url.indexOf('?')<0?'?utm_source=link&utm_medium=bio&utm_campaign=blog':'');
      a.innerHTML=(p.gorsel?'<img alt="" src="'+p.gorsel+'">':'')+'<div><b></b><span></span></div><i>&rarr;</i>';
      a.querySelector('b').textContent=p.baslik;a.querySelector('span').textContent=p.ozet||'';bl.appendChild(a)});
  }).catch(function(){});

  var cv=document.getElementById('sky'),cx=cv.getContext('2d'),W,H,D=Math.min(devicePixelRatio||1,2),st=[],sy=0,mx=0,my=0,tx=0,ty=0;
  function size(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
  size();addEventListener('resize',size);
  for(var k=0;k<130;k++)st.push({x:Math.random(),y:Math.random(),z:Math.random(),p:Math.random()*6.28,v:.00002+Math.random()*.00005});
  addEventListener('scroll',function(){sy=scrollY},{passive:true});
  addEventListener('pointermove',function(e){tx=e.clientX/W-.5;ty=e.clientY/H-.5},{passive:true});
  function draw(t){
    mx+=(tx-mx)*.05;my+=(ty-my)*.05;cx.clearRect(0,0,W,H);
    var g=cx.createRadialGradient(W*.5,H*.28,0,W*.5,H*.28,H*.7);
    g.addColorStop(0,'rgba(60,100,160,.45)');g.addColorStop(1,'rgba(27,51,88,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    for(var i=0;i<st.length;i++){
      var s=st[i];s.y-=s.v*(.5+s.z);if(s.y<-.02)s.y=1.02;
      var x=s.x*W+mx*40*s.z,y=(((s.y*H-sy*(.15+s.z*.5))%H)+H)%H+my*30*s.z,r=.5+s.z*1.6,a=.35+.2*Math.sin(t*.001+s.p)+s.z*.3;
      cx.globalAlpha=Math.max(.1,Math.min(1,a));cx.fillStyle=s.z>.8?'#F4ECA3':'#ACB187';
      cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill()}
    var py=H*.24-sy*.35;
    if(false){var pu=1+.06*Math.sin(t*.0018),px=W*.5+mx*30;
      cx.globalAlpha=.16;cx.fillStyle='#F4ECA3';cx.beginPath();cx.arc(px,py,34*pu,0,6.283);cx.fill();
      cx.globalAlpha=.9;cx.beginPath();cx.arc(px,py,7,0,6.283);cx.fill()}
    cx.globalAlpha=1;
    if(!RM)requestAnimationFrame(draw)}
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
